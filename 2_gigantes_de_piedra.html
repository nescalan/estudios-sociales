<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gigantes de Piedra · Costa Rica</title>
    <!-- W3.CSS para modales y diseño base -->
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            background: linear-gradient(145deg, #f7f0d3 0%, #e5d6b0 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .game-wrapper {
            max-width: 1300px;
            width: 100%;
            background: rgba(255, 246, 215, 0.7);
            backdrop-filter: blur(4px);
            border-radius: 70px 70px 40px 40px;
            padding: 25px 20px 35px;
            box-shadow: 0 20px 30px rgba(0,0,0,0.2), inset 0 2px 10px #fff8e0;
            border: 3px solid #f9eac3;
        }
        h1 {
            text-align: center;
            font-size: 2.6rem;
            font-weight: 700;
            color: #3d2b1a;
            text-shadow: 4px 4px 0 #eecf8b;
            letter-spacing: 2px;
            margin-top: -5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        h1 small {
            font-size: 1.2rem;
            background: #5d7a3a;
            color: #fbf3d5;
            padding: 0 20px;
            border-radius: 60px;
            text-shadow: none;
            box-shadow: inset 0 -3px 0 #2f4d1e;
        }
        .score-area {
            background: #32281b;
            padding: 12px 25px;
            border-radius: 60px;
            color: #f7e9b0;
            font-weight: bold;
            font-size: 1.8rem;
            display: inline-block;
            margin: 10px auto 20px;
            box-shadow: 0 6px 0 #1f160e;
            border: 2px solid #e6c27a;
            letter-spacing: 2px;
        }
        .score-area span {
            background: #f5d742;
            color: #2f210f;
            padding: 0 18px;
            border-radius: 40px;
            margin-left: 12px;
            font-size: 2.2rem;
            box-shadow: inset 0 -3px 0 #a5832b;
        }
        .board {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }
        .column {
            flex: 1 1 200px;
            min-width: 150px;
            background: rgba(235, 215, 160, 0.5);
            border-radius: 60px 60px 30px 30px;
            padding: 18px 10px 25px;
            backdrop-filter: blur(2px);
            box-shadow: inset 0 -8px 0 #af8f5a, 0 8px 12px rgba(0,0,0,0.15);
            border: 2px solid #dbbd82;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .column h2 {
            background: #3b5f2e;
            color: #fffaeb;
            padding: 12px 25px;
            border-radius: 40px;
            font-size: 1.8rem;
            margin-top: -30px;
            margin-bottom: 20px;
            box-shadow: 0 6px 0 #1e3a14;
            border: 2px solid #b3cf7a;
            letter-spacing: 2px;
            width: fit-content;
        }
        .column.verdadero h2 { background: #2f7840; }
        .column.falso h2 { background: #a14a3b; }
        .card-deck {
            background: #cbb187;
            padding: 15px 10px;
            border-radius: 60px;
            min-height: 280px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            box-shadow: inset 0 -5px 0 #7a623f;
            border: 3px dashed #e9d7a4;
            transition: 0.3s;
            background-image: radial-gradient(circle at 20% 30%, #dfcb9e 2px, transparent 2px), radial-gradient(circle at 80% 70%, #dfcb9e 2px, transparent 2px);
            background-size: 40px 40px;
        }
        .card {
            background: #fcf3d4;
            padding: 20px 16px;
            border-radius: 70px 70px 30px 30px;
            width: 100%;
            max-width: 260px;
            min-height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 1.3rem;
            font-weight: 600;
            color: #2d1f0c;
            box-shadow: 0 12px 0 #9a7d4e, 0 8px 20px rgba(0,0,0,0.3);
            border: 4px solid #ffeac2;
            transition: 0.1s;
            margin: 6px auto;
            cursor: grab;
            word-break: break-word;
            line-height: 1.3;
            position: relative;
        }
        .card:active {
            cursor: grabbing;
            opacity: 0.7;
        }
        .card.dragging {
            opacity: 0.3;
            transform: scale(0.95);
        }
        .card.hidden {
            display: none;
        }
        .dropzone {
            width: 100%;
            min-height: 200px;
            border-radius: 50px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 12px;
            background: rgba(255, 236, 179, 0.2);
            transition: 0.2s;
            border: 3px dashed transparent;
        }
        .dropzone.drag-over {
            background: #f1e4b0;
            border-color: #f7b731;
            border-radius: 60px;
        }
        .dropzone .card {
            cursor: default;
            box-shadow: 0 8px 0 #7a5f36;
            pointer-events: none;
        }
        .btn-group {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin: 30px 0 10px;
        }
        .btn {
            background: #fce5a2;
            border: none;
            font-size: 1.6rem;
            font-weight: bold;
            padding: 14px 35px;
            border-radius: 60px;
            color: #2d1f0c;
            box-shadow: 0 8px 0 #a48547, 0 6px 16px rgba(0,0,0,0.2);
            transition: 0.05s linear;
            cursor: pointer;
            border: 3px solid #fff3cf;
            display: inline-flex;
            align-items: center;
            gap: 12px;
        }
        .btn:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #7a5f36;
        }
        .btn.reset {
            background: #d6b17e;
            color: #241a0b;
        }
        .footer {
            text-align: center;
            color: #3d2b1a;
            font-size: 1rem;
            margin-top: 15px;
            opacity: 0.8;
            font-weight: 500;
        }

        /* MODAL W3.CSS custom */
        .w3-modal-content {
            border-radius: 60px 60px 30px 30px;
            max-width: 600px;
            padding: 20px 25px 30px;
            background: #fffbeb;
            box-shadow: 0 30px 40px rgba(0,0,0,0.5);
            border: 6px solid #f7d78a;
        }
        .w3-modal-content h2 {
            font-size: 2.5rem;
            margin: 5px 0 10px;
            color: #1d3b1a;
        }
        .w3-modal-content p {
            font-size: 1.3rem;
            line-height: 1.6;
            background: #f5ecce;
            padding: 16px 18px;
            border-radius: 50px;
            color: #1f2d0e;
        }
        .w3-button {
            background: #ffc857;
            border-radius: 60px;
            font-size: 1.6rem;
            padding: 10px 40px;
            font-weight: bold;
            color: #1d1a0e;
            border: 3px solid #f9e6a8;
            box-shadow: 0 6px 0 #b1812b;
            transition: 0.05s linear;
            margin: 10px 0 5px;
        }
        .w3-button:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #7a5f2a;
        }
        .w3-modal {
            background-color: rgba(0,0,0,0.6);
            backdrop-filter: blur(2px);
        }
        @media (max-width: 750px) {
            .board { flex-direction: column; align-items: center; }
            .column { width: 100%; max-width: 360px; }
            .card { max-width: 240px; font-size: 1.2rem; }
        }
    </style>
</head>
<body>
<div class="game-wrapper">
    <h1>
        🏔️ Gigantes de Piedra
        <small>🌋 Costa Rica</small>
    </h1>
    <div style="display: flex; justify-content: center;">
        <div class="score-area">🏆 Puntaje <span id="puntajeDisplay">0</span></div>
    </div>

    <div class="board" id="boardGame">
        <!-- Columna Verdadero -->
        <div class="column verdadero" id="colVerdadero">
            <h2>✅ Verdadero</h2>
            <div class="dropzone" id="dropVerdadero"></div>
        </div>

        <!-- Columna central: mazo de tarjetas -->
        <div class="column" style="background: #e2ca95; flex: 2 1 300px;">
            <h2 style="background: #77613b;">🃏 Mazo</h2>
            <div class="card-deck" id="deckContainer">
                <!-- las tarjetas se inyectan desde js -->
            </div>
        </div>

        <!-- Columna Falso -->
        <div class="column falso" id="colFalso">
            <h2>❌ Falso</h2>
            <div class="dropzone" id="dropFalso"></div>
        </div>
    </div>

    <div class="btn-group">
        <button class="btn reset" id="resetGameBtn">🔄 Reiniciar juego</button>
    </div>
    <div class="footer">Arrastra la tarjeta visible a Verdadero o Falso</div>
</div>

<!-- MODALES W3.CSS (se activan con JS) -->
<div id="modalFeedback" class="w3-modal">
    <div class="w3-modal-content w3-animate-zoom">
        <div class="w3-container" id="modalContent">
            <h2 id="modalTitle">🎉 ¡Muy bien!</h2>
            <p id="modalMessage">Mensaje de retroalimentación</p>
            <button class="w3-button w3-block" id="modalContinueBtn">Continuar ➡️</button>
        </div>
    </div>
</div>

<div id="modalFinal" class="w3-modal">
    <div class="w3-modal-content w3-animate-zoom">
        <div class="w3-container">
            <h2 style="color:#1d5e2b;">🏁 ¡Terminaste!</h2>
            <p id="finalMessage" style="font-size:1.8rem; background: #d9e3b0;">Puntaje final: 0</p>
            <button class="w3-button w3-block" id="finalContinueBtn">🎮 Jugar de nuevo</button>
        </div>
    </div>
</div>

<script>
    (function(){
        // ---------- AFIRMACIONES (10) sobre relieve costarricense ----------
        const afirmaciones = [
            { texto: "Las montañas de Costa Rica tienen más de 600 metros de altura.", esVerdad: true },
            { texto: "Costa Rica tiene 3 cordilleras.", esVerdad: false },
            { texto: "La Cordillera Volcánica de Guanacaste va desde el volcán Orosí hasta el Arenal.", esVerdad: true },
            { texto: "La Cordillera de Tilarán usa el viento para generar energía.", esVerdad: true },
            { texto: "La Cordillera Volcánica Central va de Tapezco al volcán Poás.", esVerdad: false },
            { texto: "La Cordillera de Talamanca es la más alta y perfecta para el ecoturismo.", esVerdad: true },
            { texto: "Todos los volcanes en Costa Rica están activos.", esVerdad: false },
            { texto: "La ceniza volcánica ayuda a que la tierra sea fértil para sembrar.", esVerdad: true },
            { texto: "En las faldas de la Cordillera Volcánica Central se practica ganadería lechera.", esVerdad: true },
            { texto: "La Cordillera de Talamanca se encuentra en el noroeste de Costa Rica.", esVerdad: false }
        ];

        // Estado del juego
        let cartas = [];              // copia activa (objetos con texto, esVerdad, id)
        let puntaje = 0;
        let cartaActualIndex = 0;     // índice en el arreglo 'cartas' de la carta visible (la primera)
        let juegoTerminado = false;
        let feedbackModal = document.getElementById('modalFeedback');
        let finalModal = document.getElementById('modalFinal');
        let puntajeSpan = document.getElementById('puntajeDisplay');
        let deckContainer = document.getElementById('deckContainer');
        let dropVerdadero = document.getElementById('dropVerdadero');
        let dropFalso = document.getElementById('dropFalso');
        let resetBtn = document.getElementById('resetGameBtn');

        // ---------- FUNCIONES AUXILIARES ----------
        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // Inicializar / reiniciar
        function initGame() {
            // Mezclar afirmaciones y asignar id
            const shuffled = shuffleArray([...afirmaciones]);
            cartas = shuffled.map((item, idx) => ({
                ...item,
                id: idx
            }));
            cartaActualIndex = 0;
            puntaje = 0;
            juegoTerminado = false;
            actualizarPuntaje();
            // Limpiar dropzones (remover tarjetas colocadas)
            dropVerdadero.innerHTML = '';
            dropFalso.innerHTML = '';
            // Cerrar modales si estan abiertos
            feedbackModal.style.display = 'none';
            finalModal.style.display = 'none';
            renderMazo();
        }

        // Renderiza el mazo (solo la primera carta visible)
        function renderMazo() {
            deckContainer.innerHTML = '';
            if (juegoTerminado) {
                deckContainer.innerHTML = '<div style="padding:20px;font-size:1.6rem;background:#b59563;border-radius:60px;color:#fff7d6;">🎯 ¡Completado!</div>';
                return;
            }
            if (cartaActualIndex >= cartas.length) {
                // Ya no hay más tarjetas -> mostrar modal final
                juegoTerminado = true;
                mostrarModalFinal();
                deckContainer.innerHTML = '<div style="padding:20px;font-size:1.6rem;background:#b59563;border-radius:60px;color:#fff7d6;">🏁 ¡Fin!</div>';
                return;
            }

            const carta = cartas[cartaActualIndex];
            const cardDiv = document.createElement('div');
            cardDiv.className = 'card';
            cardDiv.setAttribute('draggable', 'true');
            cardDiv.textContent = carta.texto;
            cardDiv.dataset.id = carta.id;
            cardDiv.dataset.verdad = carta.esVerdad;
            // Eventos drag
            cardDiv.addEventListener('dragstart', onDragStart);
            cardDiv.addEventListener('dragend', onDragEnd);
            deckContainer.appendChild(cardDiv);
        }

        // ---------- DRAG & DROP ----------
        let draggedCard = null;

        function onDragStart(e) {
            if (juegoTerminado) {
                e.preventDefault();
                return false;
            }
            const card = e.target;
            // Solo se permite arrastrar si es la primera carta (visible) y no hay otra en dropzone
            if (card !== deckContainer.querySelector('.card')) {
                e.preventDefault();
                return false;
            }
            draggedCard = card;
            card.classList.add('dragging');
            e.dataTransfer.setData('text/plain', card.dataset.id);
            e.dataTransfer.effectAllowed = 'move';
        }

        function onDragEnd(e) {
            const card = e.target;
            card.classList.remove('dragging');
            // No limpiamos draggedCard inmediatamente, se usa en drop
        }

        // Configurar dropzones
        function setupDropZones() {
            [dropVerdadero, dropFalso].forEach(drop => {
                drop.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    e.dataTransfer.dropEffect = 'move';
                    drop.classList.add('drag-over');
                });
                drop.addEventListener('dragleave', () => {
                    drop.classList.remove('drag-over');
                });
                drop.addEventListener('drop', (e) => {
                    e.preventDefault();
                    drop.classList.remove('drag-over');
                    if (juegoTerminado) return;
                    if (!draggedCard) return;
                    // Verificar que la tarjeta arrastrada sea la visible
                    const visibleCard = deckContainer.querySelector('.card');
                    if (!visibleCard || draggedCard !== visibleCard) {
                        // No es la carta visible
                        return;
                    }
                    // Obtener datos
                    const cardId = parseInt(draggedCard.dataset.id);
                    const esVerdad = draggedCard.dataset.verdad === 'true';
                    const texto = draggedCard.textContent;

                    // Determinar si la zona es verdadero o falso
                    const isDropVerdadero = (drop === dropVerdadero);
                    const usuarioDiceVerdad = isDropVerdadero;

                    // Evaluar respuesta
                    const correcto = (usuarioDiceVerdad === esVerdad);

                    // Clonar tarjeta y ponerla en la zona (solo visual)
                    const cardClone = document.createElement('div');
                    cardClone.className = 'card';
                    cardClone.textContent = texto;
                    cardClone.style.cursor = 'default';
                    cardClone.style.boxShadow = '0 6px 0 #7a5f36';
                    drop.appendChild(cardClone);

                    // Remover la carta del mazo (la visible)
                    draggedCard.remove();
                    draggedCard = null;

                    // Si correcto, sumar punto y mostrar modal felicitación
                    if (correcto) {
                        puntaje++;
                        actualizarPuntaje();
                        mostrarModalFeedback(true, texto, esVerdad);
                    } else {
                        // Incorrecto: mostrar modal con explicación
                        mostrarModalFeedback(false, texto, esVerdad);
                    }

                    // Avanzar al siguiente índice
                    cartaActualIndex++;
                    // Renderizar siguiente carta o finalizar
                    renderMazo();
                });
            });
        }

        // ---------- MODALES ----------
        function mostrarModalFeedback(acierto, texto, esVerdad) {
            const title = document.getElementById('modalTitle');
            const msg = document.getElementById('modalMessage');
            if (acierto) {
                title.innerHTML = '🎉 ¡Correcto!';
                msg.innerHTML = `✨ <strong>${texto}</strong><br>¡Excelente! Has acertado. 😊`;
            } else {
                const respuestaCorrecta = esVerdad ? 'Verdadero' : 'Falso';
                let explicacion = '';
                // Explicaciones claras para niño de 8 años
                if (texto.includes('3 cordilleras')) {
                    explicacion = 'Costa Rica tiene 4 cordilleras: Guanacaste, Tilarán, Central y Talamanca. ¡Son cuatro gigantes!';
                } else if (texto.includes('Volcánica Central va de Tapezco al volcán Poás')) {
                    explicacion = 'La Cordillera Volcánica Central va de Tapezco hasta el volcán Turrialba, no al Poás. ¡El Turrialba es su vecino!';
                } else if (texto.includes('Todos los volcanes están activos')) {
                    explicacion = 'No todos los volcanes están activos. Algunos están dormidos, pero todos son impresionantes.';
                } else if (texto.includes('Talamanca se encuentra en el noroeste')) {
                    explicacion = 'La Cordillera de Talamanca está en el sureste, cerca de Panamá. ¡Es la más alta y llena de bosques!';
                } else {
                    // Explicación genérica según el texto
                    if (esVerdad) {
                        explicacion = `"${texto}" es VERDADERO. ¡Así es nuestro relieve!`;
                    } else {
                        explicacion = `"${texto}" es FALSO. Recuerda: la información correcta está en el libro.`;
                    }
                }
                msg.innerHTML = `
                    <div style="background:#fae1d4; padding:12px; border-radius:40px; margin-bottom:8px;">
                        <strong>❌ ${texto}</strong>
                    </div>
                    <div style="background:#e3f0d3; padding:12px; border-radius:40px;">
                        <span style="font-size:1.5rem;">✅ La respuesta correcta es <strong>${respuestaCorrecta}</strong></span><br>
                        <span style="font-size:1.2rem;">📘 ${explicacion}</span>
                    </div>
                `;
            }
            feedbackModal.style.display = 'block';
            // Botón continuar
            document.getElementById('modalContinueBtn').onclick = function() {
                feedbackModal.style.display = 'none';
            };
        }

        function mostrarModalFinal() {
            const finalMsg = document.getElementById('finalMessage');
            const total = cartas.length;
            finalMsg.innerHTML = `🎈 ¡Completaste todas las tarjetas! 🎈<br>⭐ Puntaje: <strong>${puntaje}</strong> de ${total}`;
            finalModal.style.display = 'block';
            document.getElementById('finalContinueBtn').onclick = function() {
                finalModal.style.display = 'none';
                // Reiniciar automáticamente (opcional)
                initGame();
            };
        }

        // Actualizar puntaje
        function actualizarPuntaje() {
            puntajeSpan.textContent = puntaje;
        }

        // ---------- REINICIAR ----------
        resetBtn.addEventListener('click', function() {
            // Cerrar modales
            feedbackModal.style.display = 'none';
            finalModal.style.display = 'none';
            initGame();
        });

        // ---------- INICIALIZAR ----------
        setupDropZones();
        initGame();

        // Asegurar que al hacer clic fuera del modal se cierre (opcional, pero mejor mantener)
        window.onclick = function(event) {
            if (event.target === feedbackModal) {
                feedbackModal.style.display = 'none';
            }
            if (event.target === finalModal) {
                finalModal.style.display = 'none';
            }
        };

        // Prevenir que el navegador abra el enlace por defecto en drag
        document.addEventListener('dragover', (e) => e.preventDefault());
        document.addEventListener('drop', (e) => e.preventDefault());

        // Fix para que la carta visible no se pueda arrastrar si ya se terminó
    })();
</script>
</body>
</html>
