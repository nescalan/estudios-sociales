<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
    <title>🌿 Valles de Costa Rica · Juego</title>
    <!-- W3.CSS (modal y estilo base) -->
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: linear-gradient(145deg, #f7f0d9 0%, #d9e6c3 100%);
            font-family: 'Segoe UI', 'Comic Sans MS', 'Chalkboard SE', cursive, sans-serif;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .game-wrapper {
            max-width: 820px;
            width: 100%;
            background: #fff9ec;
            border-radius: 60px 60px 40px 40px;
            box-shadow: 0 16px 32px rgba(0, 40, 20, 0.25);
            padding: 30px 25px 35px;
            border: 4px solid #a6c48a;
            transition: 0.2s;
        }
        h1 {
            text-align: center;
            font-size: 2.1rem;
            font-weight: 700;
            color: #2f5d3a;
            margin-top: -8px;
            margin-bottom: 10px;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        h1 span {
            background: #e7d4a9;
            padding: 4px 18px;
            border-radius: 80px;
            font-size: 1.1rem;
            color: #1f3b26;
        }
        .score-box {
            background: #3d6b4b;
            color: white;
            padding: 12px 22px;
            border-radius: 80px;
            font-size: 1.6rem;
            font-weight: bold;
            display: inline-block;
            box-shadow: inset 0 -4px 0 #1f3b26;
            margin-bottom: 18px;
            letter-spacing: 1px;
        }
        .progress-text {
            font-size: 1.2rem;
            color: #365c3f;
            background: #e5f0d8;
            padding: 5px 22px;
            border-radius: 40px;
            display: inline-block;
            font-weight: 600;
        }
        .question-card {
            background: #f9fdef;
            border-radius: 50px;
            padding: 28px 22px 20px;
            box-shadow: 0 8px 0 #b3c99a, 0 10px 20px rgba(0,0,0,0.08);
            margin: 12px 0 18px;
            border: 2px solid #c0d8aa;
        }
        .question-text {
            font-size: 1.6rem;
            line-height: 1.3;
            font-weight: 600;
            color: #1f4028;
            text-align: center;
            padding: 0 6px;
            word-break: break-word;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-top: 24px;
        }
        @media (max-width: 550px) {
            .options-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }
            .question-text {
                font-size: 1.4rem;
            }
            .game-wrapper {
                padding: 20px 15px;
            }
        }
        .option-btn {
            background: white;
            border: 3px solid #b1cf9a;
            border-radius: 60px;
            padding: 16px 12px;
            font-size: 1.2rem;
            font-weight: 600;
            color: #1d3a25;
            box-shadow: 0 5px 0 #879e74, 0 6px 12px rgba(0,0,0,0.1);
            transition: all 0.04s linear;
            cursor: pointer;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.3;
            min-height: 72px;
            word-break: break-word;
        }
        .option-btn:hover:not(:disabled) {
            background: #f2ffe2;
            transform: scale(1.01);
        }
        .option-btn:active:not(:disabled) {
            box-shadow: 0 1px 0 #6d825b;
            transform: translateY(4px);
        }
        .option-btn:disabled {
            opacity: 0.7;
            filter: grayscale(0.2);
            cursor: not-allowed;
            box-shadow: 0 2px 0 #6d825b;
            transform: translateY(3px);
        }
        .btn-correct {
            background: #8fc77b !important;
            border-color: #3b7645 !important;
            color: #053312 !important;
            box-shadow: 0 4px 0 #21622b !important;
        }
        .btn-wrong {
            background: #e8a3a3 !important;
            border-color: #b34242 !important;
            color: #4f1717 !important;
            box-shadow: 0 4px 0 #862b2b !important;
        }
        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-top: 20px;
            gap: 12px;
        }
        .btn-reset {
            background: #e7b468;
            border: none;
            border-radius: 60px;
            padding: 14px 32px;
            font-size: 1.2rem;
            font-weight: 700;
            color: #2d402a;
            box-shadow: 0 6px 0 #a77b3e;
            cursor: pointer;
            transition: 0.07s linear;
            border: 2px solid #f3d49b;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        .btn-reset:active {
            transform: translateY(5px);
            box-shadow: 0 1px 0 #8f6b32;
        }
        .btn-reset:hover {
            background: #f5c47a;
        }
        /* modal personalización */
        .w3-modal-content {
            border-radius: 60px 60px 40px 40px;
            max-width: 580px;
            background: #fcf8ee;
            padding: 20px 20px 30px;
            box-shadow: 0 20px 40px rgba(0, 20, 0, 0.5);
            border: 6px solid #b1cf9a;
        }
        .modal-header {
            font-size: 2rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 6px;
        }
        .modal-body {
            font-size: 1.25rem;
            line-height: 1.5;
            padding: 12px 6px;
            background: #f4faea;
            border-radius: 40px;
            margin: 8px 0 18px;
        }
        .modal-btn {
            background: #3d6b4b;
            border: none;
            border-radius: 80px;
            padding: 12px 36px;
            font-size: 1.5rem;
            font-weight: bold;
            color: white;
            box-shadow: 0 5px 0 #1f3b26;
            cursor: pointer;
            transition: 0.05s linear;
        }
        .modal-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #1f3b26;
        }
        .final-score {
            background: #ffe7a3;
            border-radius: 60px;
            padding: 18px;
            font-size: 2rem;
        }
        .w3-modal {
            background-color: rgba(30, 45, 20, 0.6);
        }
        .emoji-big {
            font-size: 2.8rem;
        }
        .footer-credit {
            margin-top: 12px;
            color: #3b5e3b;
            font-weight: 500;
            opacity: 0.8;
        }
    </style>
</head>
<body>
<div class="game-wrapper" id="app">
    <h1>
        🌋 Valles de Costa Rica
        <span>🧒 3°</span>
    </h1>
    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px;">
        <div class="score-box">🏆 <span id="scoreDisplay">0</span></div>
        <div class="progress-text"><span id="currentQuestionIdx">1</span>/10</div>
    </div>

    <div class="question-card">
        <div class="question-text" id="questionText">Cargando pregunta...</div>
        <div class="options-grid" id="optionsContainer"></div>
    </div>

    <div class="action-bar">
        <button class="btn-reset" id="resetGameBtn">🔄 Reiniciar juego</button>
        <div style="font-size: 1rem; color: #4d6b3d;">✨ ¡Responde con calma!</div>
    </div>
    <div class="footer-credit">🌱 Aprendamos juntos</div>
</div>

<!-- MODAL w3.css -->
<div id="feedbackModal" class="w3-modal">
    <div class="w3-modal-content w3-animate-zoom" style="padding:24px;">
        <div class="modal-header" id="modalEmojiTitle">✅ ¡Muy bien!</div>
        <div class="modal-body" id="modalMessage">Mensaje de retroalimentación.</div>
        <div style="display: flex; justify-content: flex-end; margin-top: 6px;">
            <button class="modal-btn" id="modalContinueBtn">Continuar ➡️</button>
        </div>
    </div>
</div>

<!-- MODAL FINAL -->
<div id="finalModal" class="w3-modal">
    <div class="w3-modal-content w3-animate-zoom" style="padding:28px;">
        <div class="modal-header" style="font-size:2.2rem;">🎉 ¡Terminaste!</div>
        <div class="modal-body" style="text-align:center; font-size:1.8rem;" id="finalScoreMessage">
            Puntaje final: <span id="finalScoreSpan">0</span> / 10
        </div>
        <div style="font-size:1.3rem; padding:8px 0 12px; text-align:center;">🌟 ¡Eres un experto en los valles de Costa Rica!</div>
        <div style="display: flex; justify-content: center; gap: 20px;">
            <button class="modal-btn" id="finalCloseBtn">¡Seguir jugando! 🎮</button>
        </div>
    </div>
</div>

<script>
    (function() {
        // ----- PREGUNTAS (10) basadas en la imagen "Los valles, ríos y tierras fértiles" -----
        const QUESTIONS = [
            {
                question: "¿Qué es un valle?",
                options: [
                    "Un terreno plano entre montañas con un río.",
                    "Una montaña muy alta y rocosa.",
                    "Un desierto sin agua ni vegetación.",
                    "Un lago rodeado de volcanes."
                ],
                correct: 0
            },
            {
                question: "¿Dónde se ubica el Valle del Tempisque?",
                options: [
                    "En el centro del país.",
                    "En Guanacaste.",
                    "En el sureste.",
                    "En la región de Talamanca."
                ],
                correct: 1
            },
            {
                question: "¿Qué se cultiva principalmente en el Valle Central?",
                options: [
                    "Banano y cacao.",
                    "Café, caña de azúcar y papas.",
                    "Piña y palma aceitera.",
                    "Arroz y ganado de engorde."
                ],
                correct: 1
            },
            {
                question: "El Valle de Talamanca se caracteriza por sembrar:",
                options: [
                    "Café y plantas ornamentales.",
                    "Banano, plátano, cacao y maíz.",
                    "Piña y palma aceitera.",
                    "Arroz y ganado."
                ],
                correct: 1
            },
            {
                question: "¿En qué valle se cultiva la piña y la palma aceitera?",
                options: [
                    "Valle del Tempisque.",
                    "Valle Central.",
                    "Valle de El General-Coto Brus.",
                    "Valle de Talamanca."
                ],
                correct: 2
            },
            {
                question: "¿Por qué los valles son ideales para construir ciudades?",
                options: [
                    "Porque son terrenos planos y fáciles para hacer caminos.",
                    "Porque tienen mucha nieve todo el año.",
                    "Porque están en la cima de las montañas.",
                    "Porque son muy angostos y rocosos."
                ],
                correct: 0
            },
            {
                question: "¿Qué actividad se realiza en el Valle del Tempisque?",
                options: [
                    "Ganadería de engorde y cultivo de arroz.",
                    "Café y plantas ornamentales.",
                    "Banano y cacao.",
                    "Piña y palma aceitera."
                ],
                correct: 0
            },
            {
                question: "¿Cuál de estos cultivos NO pertenece al Valle Central?",
                options: [
                    "Caña de azúcar.",
                    "Papas.",
                    "Plantas ornamentales.",
                    "Banano."
                ],
                correct: 3
            },
            {
                question: "Los ríos que cruzan los valles ofrecen:",
                options: [
                    "Agua dulce para plantas y animales.",
                    "Agua salada para los cultivos.",
                    "Rocas y piedras para construir.",
                    "Viento frío para enfriar las ciudades."
                ],
                correct: 0
            },
            {
                question: "¿Qué valle está ubicado en el sureste de Costa Rica?",
                options: [
                    "Valle Central.",
                    "Valle del Tempisque.",
                    "Valle de Talamanca.",
                    "Valle de El General-Coto Brus."
                ],
                correct: 2  // Talamanca está en el sureste según el texto
            }
        ];

        // Shuffle (Fisher–Yates) para mezclar opciones y preguntas
        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // Mezcla las opciones de cada pregunta (preserva el índice correcto)
        function shuffleOptions(question) {
            const opts = question.options.map((text, idx) => ({ text, idx }));
            const shuffled = shuffleArray([...opts]);
            // reordenar options y actualizar correct
            const newOptions = shuffled.map(item => item.text);
            const newCorrect = shuffled.findIndex(item => item.idx === question.correct);
            return { ...question, options: newOptions, correct: newCorrect };
        }

        // Preparar preguntas: copiar y mezclar opciones
        let baseQuestions = QUESTIONS.map(q => ({ ...q }));
        // Mezclar opciones de cada pregunta (para que no tenga patrón)
        baseQuestions = baseQuestions.map(q => shuffleOptions(q));

        // Mezclar el orden de las preguntas (para que no sea predecible)
        let questions = shuffleArray([...baseQuestions]);

        // ----- Estado del juego -----
        let currentIndex = 0;            // 0 .. 9
        let score = 0;
        let answered = false;           // bloquea clics en pregunta actual
        let gameOver = false;           // si ya se completaron las 10

        // DOM elements
        const questionText = document.getElementById('questionText');
        const optionsContainer = document.getElementById('optionsContainer');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const currentQuestionIdxSpan = document.getElementById('currentQuestionIdx');
        const resetBtn = document.getElementById('resetGameBtn');

        // Modal elementos
        const feedbackModal = document.getElementById('feedbackModal');
        const modalEmojiTitle = document.getElementById('modalEmojiTitle');
        const modalMessage = document.getElementById('modalMessage');
        const modalContinueBtn = document.getElementById('modalContinueBtn');

        const finalModal = document.getElementById('finalModal');
        const finalScoreSpan = document.getElementById('finalScoreSpan');
        const finalCloseBtn = document.getElementById('finalCloseBtn');

        // ----- Funciones de renderizado -----
        function renderQuestion() {
            if (gameOver || currentIndex >= questions.length) {
                // Mostrar final (modal) se gestiona en checkGameOver
                return;
            }

            const q = questions[currentIndex];
            questionText.textContent = q.question;
            currentQuestionIdxSpan.textContent = currentIndex + 1;

            // Limpiar y generar botones
            optionsContainer.innerHTML = '';
            // Mezclar opciones al renderizar cada vez? ya se mezclaron antes. 
            // Pero para mayor dinamismo, se puede volver a mezclar (pero ya mezclamos al inicio)
            // Usamos el orden actual.
            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = opt;
                btn.dataset.index = idx;
                btn.addEventListener('click', () => handleOptionClick(idx));
                optionsContainer.appendChild(btn);
            });

            // Habilitar todos los botones (si estaban deshabilitados)
            document.querySelectorAll('.option-btn').forEach(b => b.disabled = false);
            // Remover estilos previos
            document.querySelectorAll('.option-btn').forEach(b => {
                b.classList.remove('btn-correct', 'btn-wrong');
            });
            answered = false;
        }

        // Manejar clic en opción
        function handleOptionClick(selectedIdx) {
            if (answered || gameOver) return;
            const q = questions[currentIndex];
            const isCorrect = (selectedIdx === q.correct);
            const allBtns = document.querySelectorAll('.option-btn');

            // Deshabilitar todos los botones
            allBtns.forEach(btn => btn.disabled = true);

            // Marcar visualmente correcto / incorrecto
            allBtns.forEach((btn, idx) => {
                if (idx === q.correct) {
                    btn.classList.add('btn-correct');
                } else if (idx === selectedIdx && !isCorrect) {
                    btn.classList.add('btn-wrong');
                }
            });

            // Actualizar puntaje
            if (isCorrect) {
                score++;
                scoreDisplay.textContent = score;
            }

            answered = true;

            // Mostrar modal con retroalimentación
            const correctAnswerText = q.options[q.correct];
            if (isCorrect) {
                // Modal correcto
                modalEmojiTitle.innerHTML = '✅ ¡Excelente!';
                modalMessage.innerHTML = `
                    <div style="font-size:1.2rem; font-weight:600; color:#1d5e2a;">¡Muy bien! La respuesta correcta es:</div>
                    <div style="background:#d8edca; padding:12px; border-radius:40px; margin-top:8px; font-size:1.4rem;">${correctAnswerText}</div>
                    <div style="margin-top:12px; font-size:1.1rem;">🌿 ¡Has aprendido muy bien sobre los valles de Costa Rica!</div>
                `;
            } else {
                // Modal incorrecto: explicación clara y educativa
                let explicacion = '';
                // Generar explicación específica según la pregunta (adaptada a niño de 8 años)
                const qIndex = questions.indexOf(q);
                // Usamos el texto de la pregunta y respuesta correcta
                const pregunta = q.question;
                // Construir una explicación amigable
                if (pregunta.includes('¿Qué es un valle?')) {
                    explicacion = 'Un valle es un lugar plano entre montañas, con un río que corre. ¡Por eso es tan especial para vivir y sembrar!';
                } else if (pregunta.includes('Valle del Tempisque')) {
                    explicacion = 'El Valle del Tempisque está en Guanacaste, en el noroeste de Costa Rica. Es caliente y perfecto para criar ganado y arroz.';
                } else if (pregunta.includes('Valle Central')) {
                    explicacion = 'En el Valle Central se cultivan café, caña de azúcar, papas y plantas ornamentales. ¡Es el centro del país y muy fértil!';
                } else if (pregunta.includes('Talamanca')) {
                    explicacion = 'El Valle de Talamanca está en el sureste. Allí crecen banano, plátano, cacao y maíz, ¡rodeado de naturaleza!';
                } else if (pregunta.includes('El General-Coto Brus') || pregunta.includes('piña') && pregunta.includes('palma')) {
                    explicacion = 'El Valle de El General-Coto Brus, en el sureste, es donde se siembra piña, café, plátano y palma aceitera.';
                } else if (pregunta.includes('ciudades')) {
                    explicacion = 'Los valles son planos, así que es fácil construir caminos, escuelas y casas. ¡Por eso hay muchas ciudades en los valles!';
                } else if (pregunta.includes('ganadería') && pregunta.includes('Tempisque')) {
                    explicacion = 'En el Valle del Tempisque se dedican a la ganadería de engorde y al cultivo de arroz. ¡Es una zona muy productiva!';
                } else if (pregunta.includes('cultivo NO pertenece al Valle Central')) {
                    explicacion = 'El banano no es del Valle Central, sino que crece en Talamanca. En el Valle Central hay café, caña, papas y plantas ornamentales.';
                } else if (pregunta.includes('ríos que cruzan')) {
                    explicacion = 'Los ríos dan agua dulce a las plantas y animales. ¡El agua fresca es vital para la vida en los valles!';
                } else if (pregunta.includes('sureste')) {
                    explicacion = 'El Valle de Talamanca está en el sureste de Costa Rica. Es una región llena de banano, cacao y plátano.';
                } else {
                    explicacion = `La respuesta correcta es: "${correctAnswerText}". Los valles de Costa Rica son muy especiales por sus ríos y tierras fértiles.`;
                }

                modalEmojiTitle.innerHTML = '❌ ¡Vuelve a intentarlo!';
                modalMessage.innerHTML = `
                    <div style="color:#aa3333; font-weight:600;">La respuesta correcta es:</div>
                    <div style="background:#f5d6d6; padding:12px; border-radius:40px; margin:8px 0; font-size:1.3rem;">${correctAnswerText}</div>
                    <div style="background:#d9e8cf; padding:14px; border-radius:30px; margin-top:8px; font-size:1.1rem;">
                        <strong>📚 Aprendamos:</strong> ${explicacion}
                    </div>
                `;
            }

            // Mostrar modal
            feedbackModal.style.display = 'block';
        }

        // Cerrar modal y continuar
        function closeFeedbackAndContinue() {
            feedbackModal.style.display = 'none';
            // Avanzar a siguiente pregunta o finalizar
            if (!gameOver) {
                currentIndex++;
                if (currentIndex < questions.length) {
                    renderQuestion();
                } else {
                    // Juego terminado
                    gameOver = true;
                    showFinalModal();
                }
            }
        }

        // Mostrar modal final
        function showFinalModal() {
            finalScoreSpan.textContent = score;
            finalModal.style.display = 'block';
        }

        // Reiniciar juego
        function resetGame() {
            // Cerrar modales abiertos
            feedbackModal.style.display = 'none';
            finalModal.style.display = 'none';

            // Re-barajar preguntas y opciones
            let newBase = QUESTIONS.map(q => ({ ...q }));
            newBase = newBase.map(q => shuffleOptions(q));
            questions = shuffleArray([...newBase]);

            currentIndex = 0;
            score = 0;
            gameOver = false;
            answered = false;
            scoreDisplay.textContent = '0';
            renderQuestion();
        }

        // Event listeners
        modalContinueBtn.addEventListener('click', closeFeedbackAndContinue);
        // Cerrar modal si se hace clic fuera (opcional pero amigable)
        feedbackModal.addEventListener('click', function(e) {
            if (e.target === this) closeFeedbackAndContinue();
        });

        finalCloseBtn.addEventListener('click', function() {
            finalModal.style.display = 'none';
            // Después de final, si se cierra, se puede seguir jugando (reiniciar)
            // Pero no reinicia automaticamente, permitimos que el usuario use "Reiniciar"
            // mostramos un mensaje sutil: el juego queda en estado "gameOver" pero se puede reiniciar.
            // Si se hace clic en "seguir jugando" reiniciamos?
            // Mejor reiniciar automáticamente para que sea más fluido.
            resetGame();
        });

        resetBtn.addEventListener('click', resetGame);

        // Inicializar
        resetGame(); // carga el primer set

        // Si el usuario cierra final con X, también manejamos
        // (pero el botón final ya hace reset)
        window.addEventListener('load', function() {
            // garantizar que todo se vea bien
        });
    })();
</script>
</body>
</html>
